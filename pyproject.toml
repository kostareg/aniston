[project]
name = "aniston"
version = "0.1.0"
description = "ESPN fantasy football analysis and trade-edge engine"
requires-python = ">=3.12"
dependencies = [
  "espn-api>=0.45",
  "nflreadpy>=0.1",
  "polars>=1.0",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "streamlit>=1.40",
  "plotly>=5.24",
]

[project.scripts]
aniston = "aniston.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aniston"]

[tool.pytest.ini_options]
testpaths = ["tests"]
